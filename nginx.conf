server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths (e.g. /game/123) fall back to index.html
    # so React Router can handle them instead of nginx returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts hashed files in /assets, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html, so new deployments show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
